# Netlify build for the Vite SPA in this repo.
#
# The app is client-only — plans live in the browser's IndexedDB and both
# exporters run in the page — so there is nothing to configure beyond building
# the static bundle. No environment variables are required (.env.example).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and @vitejs/plugin-react require ^20.19.0 || >=22.12.0. Pinned so a
  # change to Netlify's default image cannot quietly drop the build below it.
  NODE_VERSION = "22"

# `npm run build` is `tsc -b && vite build`, so the type-checker has to be
# installed: Netlify skips devDependencies when NODE_ENV=production, which is
# the default for a production context.
  NPM_FLAGS = "--include=dev"

# The app has no client-side router — it reads `?dashboardView=` off `/` — but
# a deck's QR codes are deep links, and a stray path should land on the app
# rather than on Netlify's 404. Serve index.html for anything the publish
# directory does not hold a file for.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
