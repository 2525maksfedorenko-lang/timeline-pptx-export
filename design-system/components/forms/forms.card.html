<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:hsl(var(--background))}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.lbl{font-size:11px;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.06em}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Label, Checkbox, RadioGroup, RadioGroupItem, Switch, Select, MultiSelect, FormItem, FormLabel, FormControl, FormMessage, DatePicker, Calendar, Command, Icon } = window.AicooCoordinatorDesignSystem_42e5f1;
function Demo(){
  const [d,setD] = React.useState(new Date("2026-09-30"));
  return (
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:18,alignItems:"start"}}>
    <div className="col">
      <div className="col" style={{gap:6}}>
        <Label>Project title</Label>
        <Input defaultValue="Rollout DACH" />
      </div>
      <div className="col" style={{gap:6}}>
        <Label>Search</Label>
        <div style={{position:"relative"}}>
          <span style={{position:"absolute",left:12,top:12,color:"hsl(var(--muted-foreground))"}}><Icon name="search" /></span>
          <Input placeholder="Search channels" style={{paddingLeft:36}} />
        </div>
      </div>
      <FormItem>
        <FormLabel>Email</FormLabel>
        <FormControl><Input invalid defaultValue="not-an-email" /></FormControl>
        <FormMessage>Please enter a valid email address</FormMessage>
      </FormItem>
      <Textarea placeholder="Describe the project" rows={2} />
    </div>
    <div className="col">
      <Select width="100%" defaultValue="all" options={[{value:"all",label:"All sources"},{value:"slack_channel",label:"Slack"},{value:"email_address",label:"Email"},{value:"sembly_sink",label:"Sembly"}]} />
      <MultiSelect defaultValue={["ml"]} options={[{value:"ml",label:"M. Lang"},{value:"jd",label:"J. Dorn"},{value:"ab",label:"A. Behrens"}]} />
      <div className="row" style={{gap:8}}><Checkbox defaultChecked /><Label>Send automated mails</Label></div>
      <div className="row" style={{gap:8}}><Checkbox /><Label>Include archived</Label></div>
      <RadioGroup defaultValue="gantt">
        <div className="row" style={{gap:8}}><RadioGroupItem value="gantt" /><Label>Gantt</Label></div>
        <div className="row" style={{gap:8}}><RadioGroupItem value="kanban" /><Label>Kanban</Label></div>
      </RadioGroup>
      <div className="row" style={{justifyContent:"space-between",width:200}}><Label>Assistant active</Label><Switch defaultChecked /></div>
      <div className="row" style={{justifyContent:"space-between",width:200}}><Label>Auto-apply</Label><Switch /></div>
      <div className="col" style={{gap:6}}><Label>Deadline</Label><DatePicker value={d} onChange={setD} /></div>
    </div>
    <div className="col">
      <div style={{border:"1px solid hsl(var(--border))",borderRadius:"var(--radius-md)",background:"hsl(var(--popover))"}}>
        <Calendar selected={d} onSelect={setD} />
      </div>
      <Command style={{width:"100%"}} groups={[{label:"Projects",items:[{value:"a",label:"Rollout DACH"},{value:"b",label:"Warehouse migration"}]},{label:"Tags",items:[{value:"c",label:"Logistics"}]}]} />
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
