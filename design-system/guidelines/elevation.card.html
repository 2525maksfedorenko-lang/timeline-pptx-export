<!-- @dsCard group="Brand" viewport="700x150" name="Elevation" subtitle="Cards rest at shadow-sm and lift to shadow-md on hover; dialogs shadow-lg" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body><div class="row" style="align-items:flex-end;padding:8px">
<div style="text-align:center"><div style="height:56px;width:130px;border-radius:var(--radius-lg);background:hsl(var(--card));border:1px solid hsl(var(--border));box-shadow:var(--shadow-sm)"></div><div class="n">sm · card rest</div></div><div style="text-align:center"><div style="height:56px;width:130px;border-radius:var(--radius-lg);background:hsl(var(--card));border:1px solid hsl(var(--border));box-shadow:var(--shadow)"></div><div class="n">default</div></div><div style="text-align:center"><div style="height:56px;width:130px;border-radius:var(--radius-lg);background:hsl(var(--card));border:1px solid hsl(var(--border));box-shadow:var(--shadow-md)"></div><div class="n">md · hover, menus</div></div><div style="text-align:center"><div style="height:56px;width:130px;border-radius:var(--radius-lg);background:hsl(var(--card));border:1px solid hsl(var(--border));box-shadow:var(--shadow-lg)"></div><div class="n">lg · dialogs</div></div>
</div><div class="v" style="margin-top:8px">No inner shadows anywhere. Focus states are 2px rings offset 2px, never glows.</div></body></html>
