<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body><div class="row" style="align-items:center">
<div style="text-align:center"><div style="height:36px;width:120px;border-radius:var(--radius-md);background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500">36px sm</div></div><div style="text-align:center"><div style="height:40px;width:120px;border-radius:var(--radius-md);background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500">40px default</div></div><div style="text-align:center"><div style="height:44px;width:120px;border-radius:var(--radius-md);background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500">44px lg</div></div>
<div style="height:40px;width:40px;border-radius:var(--radius-md);border:1px solid hsl(var(--input));display:flex;align-items:center;justify-content:center;font-size:11px">icon</div>
<div style="height:48px;width:200px;border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;font-size:12px;color:hsl(var(--muted-foreground))">48px app header row</div>
</div></body></html>
