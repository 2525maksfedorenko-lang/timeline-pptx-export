<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body>
<div style="font-size:22px;font-weight:600">Aa Bb Cc — 0123456789</div>
<div class="v" style="margin-top:8px">--font-sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"…</div>
<div class="v" style="margin-top:4px">--font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas…</div>
<div style="margin-top:8px;font-size:12px;padding:6px 8px;border-radius:var(--radius-md);background:hsl(var(--muted));display:inline-block">No @font-face anywhere in the source. Do not substitute a Google Font.</div>
</body></html>
