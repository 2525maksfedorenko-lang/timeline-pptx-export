<!-- @dsCard group="Brand" viewport="700x180" name="Logo" subtitle="Orbit mark + wordmark, dark-blue and light-blue variants" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body>
<div class="row" style="align-items:center;gap:20px">
<div style="background:hsl(var(--primary));padding:14px 18px;border-radius:var(--radius-lg)"><img src="../assets/aicoo-logo-orbit-lightblue-text.svg" alt="aicoo" style="height:34px"></div>
<div style="background:hsl(var(--base-background));padding:14px 18px;border-radius:var(--radius-lg)"><img src="../assets/aicoo-logo-orbit-darkblue-text.svg" alt="aicoo" style="height:34px"></div>
<div style="background:hsl(var(--primary));padding:10px;border-radius:var(--radius-lg)"><img src="../assets/aicoo-logo-orbit-lightblue.svg" alt="aicoo mark" style="height:30px"></div>
<div style="background:hsl(var(--base-background));padding:10px;border-radius:var(--radius-lg)"><img src="../assets/aicoo-logo-orbit-darkblue.svg" alt="aicoo mark" style="height:30px"></div>
<div style="background:hsl(var(--primary));padding:10px;border-radius:var(--radius-lg)"><img src="../assets/aicoo-logo-orbit-darkblue-outline-lightblue.svg" alt="aicoo outline mark" style="height:30px"></div>
</div>
<div class="v" style="margin-top:10px">Sidebar uses the lightBlue full logo at 32px height (icon-only at 32px when collapsed); login uses the darkblue-outline/lightblue-text lockup at 48px. Lowercase "aicoo" always.</div>
</body></html>
