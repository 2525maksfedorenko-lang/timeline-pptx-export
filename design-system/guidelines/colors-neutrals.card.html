<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:hsl(0 0% 3.9%)"></div><div class="n">foreground</div><div class="v">0 0% 3.9%</div></div><div class="sw"><div class="chip" style="background:hsl(0 0% 45.1%)"></div><div class="n">muted-fg</div><div class="v">0 0% 45.1%</div></div><div class="sw"><div class="chip" style="background:hsl(0 0% 96.1%)"></div><div class="n">muted / accent</div><div class="v">0 0% 96.1%</div></div><div class="sw"><div class="chip" style="background:hsl(0 0% 96.1%)"></div><div class="n">secondary</div><div class="v">0 0% 96.1%</div></div><div class="sw"><div class="chip" style="background:hsl(0 0% 89.8%)"></div><div class="n">border / input</div><div class="v">0 0% 89.8%</div></div><div class="sw"><div class="chip" style="background:hsl(0 0% 100%)"></div><div class="n">card / popover</div><div class="v">0 0% 100%</div></div>
</div></body></html>
