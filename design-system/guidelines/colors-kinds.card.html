<!-- @dsCard group="Colors" viewport="700x120" name="Work-item kinds" subtitle="Purple project, amber phase, blue task — the selection/highlight ring colours" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body><div class="row" style="align-items:center;gap:14px">
<div style="width:150px;border-radius:var(--radius-lg);border:1px solid var(--kind-project);background:hsl(var(--card));padding:10px;box-shadow:var(--selection-ring-project);font-size:13px;font-weight:500;color:var(--kind-project)">Project</div>
<div style="width:150px;border-radius:var(--radius-lg);border:1px solid var(--kind-phase);background:hsl(var(--card));padding:10px;box-shadow:var(--selection-ring-phase);font-size:13px;font-weight:500;color:var(--kind-phase)">Phase</div>
<div style="width:150px;border-radius:var(--radius-lg);border:1px solid var(--kind-task);background:hsl(var(--card));padding:10px;box-shadow:var(--selection-ring-task);font-size:13px;font-weight:500;color:var(--kind-task)">Task</div>
<div class="v" style="max-width:180px">--selection-ring-* is applied when a row is selected; a plain 2px ring when merely highlighted.</div>
</div></body></html>
