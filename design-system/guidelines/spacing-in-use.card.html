<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body><div class="row" style="align-items:stretch;gap:12px">
<div style="border:1px dashed hsl(var(--border));border-radius:var(--radius-lg);padding:24px;font-size:12px">Card · 24</div>
<div style="border:1px dashed hsl(var(--border));border-radius:var(--radius-lg);padding:12px;font-size:12px">Kanban task · 12</div>
<div style="border:1px dashed hsl(var(--border));border-radius:var(--radius-xl);padding:14px;font-size:12px">Channel card · 14</div>
<div style="border:1px dashed hsl(var(--border));border-radius:var(--radius-md);padding:16px;font-size:12px">Table cell · 16</div>
<div style="border:1px dashed hsl(var(--border));border-radius:var(--radius-md);padding:8px;font-size:12px">Table wrapper · 8</div>
</div>
<div class="v" style="margin-top:10px">Page gutters 24 (desktop) / 12 (mobile). List pages cap at --content-max 1152px. Control gaps 8; card grids 14.</div>
</body></html>
