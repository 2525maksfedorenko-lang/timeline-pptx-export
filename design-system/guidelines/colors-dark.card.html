<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:hsl(var(--background));font-family:var(--font-sans);color:hsl(var(--foreground))}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.sw{width:96px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid hsl(var(--border))}.n{font-size:11px;font-weight:600;margin-top:5px}.v{font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}</style></head><body><div class="dark" style="background:hsl(var(--background));padding:12px;border-radius:var(--radius-md)"><div class="row">
<div class="sw"><div class="chip" style="background:hsl(212 30% 11%)"></div><div class="n">background</div><div class="v">212 30% 11%</div></div><div class="sw"><div class="chip" style="background:hsl(212 22% 8%)"></div><div class="n">card</div><div class="v">212 22% 8%</div></div><div class="sw"><div class="chip" style="background:hsl(212 22% 3%)"></div><div class="n">muted</div><div class="v">212 22% 3%</div></div><div class="sw"><div class="chip" style="background:hsl(212 22% 25%)"></div><div class="n">accent</div><div class="v">212 22% 25%</div></div><div class="sw"><div class="chip" style="background:hsl(212 22% 25%)"></div><div class="n">border</div><div class="v">212 22% 25%</div></div><div class="sw"><div class="chip" style="background:hsl(0 0% 98%)"></div><div class="n">primary</div><div class="v">inverts to white</div></div>
</div><div class="v" style="margin-top:8px;color:hsl(var(--muted-foreground))">In dark mode --primary inverts to near-white; the sidebar stays navy.</div></div></body></html>
